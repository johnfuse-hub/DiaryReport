name: Scheduled Water Situation LINE Alert & Sync

on:
  schedule:
    - cron: '30 2,5,8,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 beautifulsoup4 pandas

      - name: Run Water Monitor Script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID || 'Ua666a6ab22c5871d5cf4dc99d0f5045c' }}
        run: |
          echo "📂 รายการไฟล์ทั้งหมดใน Repository:"
          ls -la
          echo "-----------------------------------"
          
          # ค้นหาและรันไฟล์ water_monitor.py ทันที
          SCRIPT_PATH=$(find . -name "water_monitor.py" | head -n 1)
          if [ -n "$SCRIPT_PATH" ]; then
            echo "🚀 กำลังรันสคริปต์ที่: $SCRIPT_PATH"
            python "$SCRIPT_PATH"
          else
            echo "❌ ไม่พบไฟล์ water_monitor.py ใน Repository กรุณาอัปโหลดไฟล์นี้ขึ้น GitHub"
            exit 1
          fi
