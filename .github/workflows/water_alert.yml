name: Scheduled Water Situation LINE Alert & Sync

on:
  schedule:
    # รันส่งแจ้งเตือนวันละ 4 ครั้งตามเวลาประเทศไทย (UTC+7):
    # 09:30 น. (UTC 02:30), 12:30 น. (UTC 05:30), 15:30 น. (UTC 08:30), 18:30 น. (UTC 11:30)
    - cron: '30 2,5,8,11 * * *'

  workflow_dispatch: # เปิดให้ผู้ใช้สามารถกดสั่งรันแจ้งเตือนเองได้ตลอดเวลาผ่านหน้าเว็บ GitHub
    inputs:
      force_alert:
        description: 'บังคับส่ง LINE ทันทีแม้ไม่อยู่ในรอบเวลาปกติ'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  check-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Fetch Real-time RID Data & Send LINE Alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID || 'broadcast' }}
        run: |
          python python/water_monitor.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_data.json js/live-data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update water data at scheduled time [skip ci]" && git push)
