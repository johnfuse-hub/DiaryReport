name: Scheduled Water Situation LINE Alert & Sync

on:
  schedule:
    # รันอัตโนมัติวันละ 4 รอบตามเวลาไทย (09:30, 12:30, 15:30, 18:30 น.)
    - cron: '30 2,5,8,11 * * *'

  workflow_dispatch: # ปุ่มกดสั่งรันเองได้ตลอดเวลา

permissions:
  contents: write

jobs:
  check-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 beautifulsoup4 pandas || pip install requests urllib3

      - name: Fetch Real-time RID Data & Send LINE Alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID || 'broadcast' }}
        run: |
          if [ -f "python/water_monitor.py" ]; then
            python python/water_monitor.py
          elif [ -f "water_monitor.py" ]; then
            python water_monitor.py
          else
            find . -name "water_monitor.py" -exec python {} \;
          fi

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update water data [skip ci]" && git push) || echo "Skip push"
